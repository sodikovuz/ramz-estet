<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>RAMZ ESTET — WebApp Admin</title>
<style>
:root{--bg:#07090d;--c:#10151d;--c2:#0b1017;--l:#ffffff12;--t:#f5f7fa;--m:#8d98a8;--g:#d7b45a;--ok:#49d487;--bad:#ff6574}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#211b0e,#07090d 40%);color:var(--t);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1280px,94vw);margin:auto;padding:20px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{font-size:26px;font-weight:950;letter-spacing:2px}.muted{color:var(--m)}.actions,.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--l);background:#171d26;color:#fff;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.btn.gold{background:var(--g);color:#080808;border-color:transparent}.btn.red{background:#2a1116;color:#ffabb3}.btn:disabled{opacity:.5}.tabs{display:flex;gap:6px;overflow:auto;padding:5px;background:#0b0f14;border:1px solid var(--l);border-radius:14px;margin-bottom:15px}.tab{border:0;background:transparent;color:var(--m);padding:10px 14px;border-radius:10px;font-weight:850;white-space:nowrap}.tab.active{background:#1a2029;color:#fff}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.full{grid-column:1/-1}.card{background:linear-gradient(180deg,#111720,#0d1219);border:1px solid var(--l);border-radius:18px;padding:18px;box-shadow:0 14px 45px #0007}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:#090d12;border:1px solid var(--l);border-radius:13px;padding:13px}.num{font-size:25px;font-weight:950}.label{font-size:11px;color:var(--m);margin-top:3px}.list{max-height:600px;overflow:auto}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--l)}.item:last-child{border:0}.title{font-weight:900}.meta{font-size:12px;color:var(--m);margin-top:4px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#181e27;border:1px solid var(--l);font-size:11px;font-weight:900}.pill.ok{color:#86e8ae}.pill.bad{color:#ff9da6}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}.field label{font-weight:850}.input,.textarea,.select{width:100%;background:#090d12;color:#fff;border:1px solid var(--l);border-radius:10px;padding:11px 12px;outline:0}.textarea{min-height:100px;resize:vertical}.info{padding:11px 12px;background:#0b1118;border:1px solid #6ea8ff22;border-radius:12px;color:#adbad0;line-height:1.5;margin:12px 0}.rows{max-height:360px;overflow:auto}.row{padding:9px 0;border-bottom:1px solid var(--l)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px}.setting{display:flex;justify-content:space-between;gap:12px;padding:13px;background:var(--c2);border:1px solid var(--l);border-radius:13px}.sn{font-weight:850}.sd{font-size:12px;color:var(--m);line-height:1.4;margin-top:3px}.switch{position:relative;width:45px;height:25px;flex:0 0 auto}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#272d36;border:1px solid #ffffff16;border-radius:30px}.slider:before{content:"";position:absolute;width:19px;height:19px;left:2px;top:2px;background:#a9b0ba;border-radius:50%;transition:.18s}.switch input:checked+.slider{background:#876f2e;border-color:#bda35b}.switch input:checked+.slider:before{transform:translateX(19px);background:#fff}.empty{text-align:center;padding:30px;color:var(--m)}.toast{position:fixed;right:18px;bottom:18px;background:#171d25;border:1px solid var(--l);padding:12px 14px;border-radius:12px;display:none}.toast.show{display:block}.toast.bad{border-color:#ff657455}
@media(max-width:850px){.grid,.form,.settings{grid-template-columns:1fr}.full,.wide{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.wrap{width:92vw}.stats{grid-template-columns:1fr 1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">RAMZ ESTET</div><div class="muted">Umumiy WebApp Admin Panel — barcha boshqaruv bitta joyda</div></div><div class="actions"><button class="btn" onclick="load()">↻ Yangilash</button><button class="btn gold" onclick="tab('create')">＋ Giveaway yaratish</button></div></div>
<div class="tabs"><button id="t-dashboard" class="tab active" onclick="tab('dashboard')">Dashboard</button><button id="t-giveaways" class="tab" onclick="tab('giveaways')">Barcha giveawaylar</button><button id="t-create" class="tab" onclick="tab('create')">Yaratish</button><button id="t-detail" class="tab" onclick="tab('detail')">Qatnashchilar / G‘oliblar</button><button id="t-settings" class="tab" onclick="tab('settings')">Admin Settings</button></div>
<div id="app"><div class="card">Yuklanmoqda...</div></div></div><div id="toast" class="toast"></div>
<script>
window.__adminBooted=false;
window.addEventListener('error',function(e){
  try{fetch('/api/client-log',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({action:'admin.bootstrap.error',level:'critical',message:e.message||'Admin JavaScript error',errorName:e.error?.name||'ScriptError',stack:e.error?.stack||'',page:location.pathname,url:location.href.split('#')[0],line:e.lineno||null,column:e.colno||null,viewport:innerWidth+'x'+innerHeight,online:navigator.onLine,telegramVersion:window.Telegram?.WebApp?.version||''})})}catch(_){}
  var app=document.getElementById('app');if(app&&!window.__adminBooted){app.innerHTML='<div class="card"><h2>Admin panel xatosi</h2><p class="muted">JavaScript ishga tushmadi. Xato avtomatik logga yuborildi.</p></div>'}
});
window.setTimeout(function(){if(!window.__adminBooted){var app=document.getElementById('app');if(app&&app.textContent.includes('Yuklanmoqda'))app.innerHTML='<div class="card"><h2>Admin panel ishga tushmadi</h2><p class="muted">JavaScript yuklanishi kutilganidan uzoq davom etdi. Xato logga yuborildi.</p></div>'}},5000);
</script>
<script src="/admin.js?v=__ASSET_VERSION__" defer></script></body></html>
