<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMZ ESTET — Admin</title>
<style>body{margin:0;background:#080506;color:#fff;font-family:Arial}.app{width:min(700px,92%);margin:auto;padding:40px 0}h1{color:#ff3045}textarea{width:100%;height:300px;background:#111;color:#fff;border:1px solid #55202a;border-radius:10px;padding:15px;box-sizing:border-box}button{width:100%;padding:16px;margin-top:12px;border:0;border-radius:10px;cursor:pointer;font-weight:bold}.load{background:#222;color:#fff}.spin{background:#e51d35;color:#fff;font-size:18px}.reset{background:#333;color:#bbb}.status{margin-top:20px;padding:15px;background:#16090c;border-radius:10px}</style></head><body><div class="app"><h1>RAMZ ESTET — ADMIN</h1><p>🏆 5 ta g‘olib · ⭐ 15 Stars</p><textarea id="participants" placeholder="@username1&#10;@username2&#10;@username3"></textarea><button class="load" onclick="uploadParticipants()">📥 ISHTIROKCHILARNI YUKLASH</button><button class="spin" onclick="spin()">🎡 BARABANNI BOSHLASH</button><button class="reset" onclick="resetGiveaway()">↻ RESET</button><div class="status" id="status">Tayyor</div></div>
<script>
async function uploadParticipants(){const text=document.getElementById("participants").value;const participants=text.split("\n").map(x=>x.trim()).filter(Boolean);if(!participants.length)return alert("Ishtirokchilarni kiriting.");const r=await fetch("/api/participants",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({participants})});const d=await r.json();document.getElementById("status").textContent=`✅ ${d.count} ta ishtirokchi yuklandi`}
async function spin(){const r=await fetch("/api/spin",{method:"POST"}),d=await r.json();if(!r.ok)return alert(d.error);document.getElementById("status").textContent=`🎡 ${d.spin}-spin boshlandi: ${d.winner}`;setTimeout(finishSpin,6500)}
async function finishSpin(){await fetch("/api/finish",{method:"POST"})}
async function resetGiveaway(){if(!confirm("Giveawayni reset qilamizmi?"))return;await fetch("/api/reset",{method:"POST"});document.getElementById("status").textContent="↻ Giveaway reset qilindi"}
</script></body></html>
