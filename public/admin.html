<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMZ ESTET — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(800px,94vw);margin:auto;padding:30px 0}.card{background:#111;border:1px solid #fff1;border-radius:18px;padding:20px;margin:12px 0}h1{margin:0 0 5px}.muted{color:#888}label{display:block;color:#aaa;font-size:13px;margin:14px 0 6px}textarea,input{width:100%;padding:12px;border-radius:11px;border:1px solid #fff2;background:#080808;color:#fff}textarea{min-height:180px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.roundbox{border:1px solid #fff1;padding:10px;border-radius:12px}.buttons{display:flex;gap:10px;margin-top:15px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.start{background:#e22;color:#fff}.reset{background:#222;color:#fff}.msg{margin-top:12px;color:#aaa;min-height:22px}@media(max-width:600px){.rounds{grid-template-columns:1fr 1fr}.buttons{flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<h1>RAMZ ESTET</h1><div class="muted">5-round realtime demo admin</div>
<div class="card">
<label>Admin secret</label><input id="secret" type="password">
<label>Participantlar — har qatorda bitta</label>
<textarea id="participants" placeholder="@user1&#10;@user2&#10;@user3"></textarea>
<label>G‘oliblar soni</label><input id="total" type="number" min="1" max="5" value="5">
<label>Har round duration (ms)</label><input id="duration" type="number" min="5000" max="15000" value="8000">
</div>
<div class="card"><label>Round target indexlari (0 dan boshlanadi)</label><div id="rounds" class="rounds"></div></div>
<div class="card"><div class="buttons"><button class="start" id="start">START GIVEAWAY</button><button class="reset" id="reset">RESET</button></div><div id="msg" class="msg"></div></div>
</div>
<script>
const $=id=>document.getElementById(id), rounds=$("rounds"), total=$("total");
function drawInputs(){rounds.innerHTML="";for(let i=1;i<=Number(total.value);i++){const d=document.createElement("div");d.className="roundbox";d.innerHTML=`<b>G‘olib #${i}</b><input class="target" type="number" min="0" value="${i-1}">`;rounds.appendChild(d)}}
total.oninput=drawInputs;drawInputs();
$("start").onclick=async()=>{
 const participants=$("participants").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const targets=[...document.querySelectorAll(".target")].map(x=>Number(x.value));
 if(!participants.length)return $("msg").textContent="Participant kiriting.";
 if(new Set(targets).size!==targets.length)return $("msg").textContent="Target indexlar takrorlanmasin.";
 $("msg").textContent="Giveaway ishga tushmoqda...";
 try{
  const r=await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json","x-admin-secret":$("secret").value},body:JSON.stringify({participants,targets,totalRounds:Number(total.value),durationMs:Number($("duration").value)})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Xatolik");$("msg").textContent=`Giveaway #${d.event.giveawayId} boshlandi.`;
 }catch(e){$("msg").textContent=e.message}
};
$("reset").onclick=async()=>{
 if(!confirm("Reset?"))return;
 const r=await fetch("/api/reset",{method:"POST",headers:{"x-admin-secret":$("secret").value}});
 const d=await r.json();$("msg").textContent=r.ok?"Reset qilindi.":d.error||"Xatolik";
};
</script>
</body></html>
