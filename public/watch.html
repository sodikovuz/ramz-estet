<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMZ ESTET — LIVE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif;text-align:center}
.wrap{width:min(900px,94vw);margin:auto;padding:18px 0 40px}.brand{font-weight:950;letter-spacing:4px;font-size:26px}.muted{color:#888}
.card{background:#111;border:1px solid #fff2;border-radius:20px;padding:20px;margin-top:15px}.count{font-size:17px}.timer{font-size:42px;font-weight:950;margin:15px}.status{font-weight:900;margin:8px}
.wheel{margin:22px auto;width:min(620px,88vw);height:190px;overflow:hidden;border:2px solid #333;border-radius:22px;position:relative;background:#0b0b0b}
.track{display:flex;align-items:center;height:100%;gap:12px;position:absolute;left:0;will-change:transform}
.item{min-width:150px;padding:28px 12px;border:1px solid #333;border-radius:15px;font-weight:900;background:#151515}
.pointer{position:absolute;z-index:3;left:50%;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 15px #fff}
.win{font-size:34px;font-weight:950;padding:22px}.confetti{font-size:42px}
.viewer{font-size:13px;color:#999}
</style></head><body><div class="wrap">
<div class="brand">RAMZ ESTET</div><div class="muted">LIVE GIVEAWAY</div>
<div id="app"></div>
<script>
(function(){window.addEventListener('error',function(e){try{fetch('/api/client-log',{method:'POST',headers:{'Content-Type':'application/json','x-telegram-init-data':window.Telegram?.WebApp?.initData||''},body:JSON.stringify({level:'error',action:'window.error',message:e.message||'Client error',stack:e.error?.stack||'',page:location.pathname})})}catch(_){}});window.addEventListener('unhandledrejection',function(e){try{fetch('/api/client-log',{method:'POST',headers:{'Content-Type':'application/json','x-telegram-init-data':window.Telegram?.WebApp?.initData||''},body:JSON.stringify({level:'error',action:'unhandledrejection',message:String(e.reason?.message||e.reason||'Unhandled rejection'),stack:e.reason?.stack||'',page:location.pathname})})}catch(_){}})})();
</script>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const q=new URLSearchParams(location.search);
const tgInit=tg?.initData||'';
const startParam=tg?.initDataUnsafe?.start_param||q.get('startapp')||q.get('tgWebAppStartParam')||'';
const gid=Number(q.get("gid")||0);
let meta=null, state=null, channel=null, me=tg?.initDataUnsafe?.user||null, anim=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
async function getMeta(){
 const r=await fetch('/api/current-giveaway',{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':tgInit},body:JSON.stringify({startApp:startParam}),cache:'no-store'}); return r.json();
}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`;}
function render(){
 if(!meta)return;
 const g=meta.giveaway,s=meta.state||{};
 document.getElementById("app").innerHTML=`
 <div class="card">
   <h1>${esc(g.title)}</h1><p>${esc(g.description||"")}</p>
   <div class="count">👥 ${meta.participantCount} ishtirokchi · 👁 <span id="viewers">${meta.viewerCount}</span> kuzatuvchi</div>
   <div class="timer" id="timer">--:--</div><div class="status" id="status">${esc(s.status||g.status)}</div>
   <div class="wheel"><div class="pointer"></div><div id="track" class="track"></div></div>
   <div id="winner"></div>
 </div>`;
 updateClock(); updateTrack(s);
}
function updateClock(){
 const t=document.getElementById("timer"); if(!t||!meta)return;
 const s=meta.state||{}, now=Date.now();
 if(s.status==="scheduled" && s.startAt){t.textContent=fmt(s.startAt-now);requestAnimationFrame(updateClock);}
 else t.textContent=s.status==="spinning"?"AYLANMOQDA":"LIVE";
}
function buildTrack(list){
 const el=document.getElementById("track"); if(!el)return;
 el.innerHTML=[...list,...list,...list].map((x,i)=>`<div class="item">${esc(x)}</div>`).join("");
}
function updateTrack(s){
 if(!s?.participants?.length)return;
 buildTrack(s.participants);
 if(s.status==="spinning" && s.startAt) animate(s);
}
function animate(s){
 cancelAnimationFrame(anim);
 const el=document.getElementById("track"), list=s.participants||[];
 const itemW=162, center=(document.querySelector(".wheel")?.clientWidth||600)/2-itemW/2;
 const target=(Number(s.targetIndex)||0)+list.length+Math.floor(list.length*1.5);
 const end=center-target*itemW;
 const start=-((Number(s.currentIndex)||0)*itemW);
 const t0=Number(s.startAt), dur=Number(s.durationMs||8000);
 function frame(now){
   const p=Math.max(0,Math.min(1,(Date.now()-t0)/dur));
   const e=1-Math.pow(1-p,3);
   el.style.transform=`translateX(${start+(end-start)*e}px)`;
   if(p<1) anim=requestAnimationFrame(frame);
 }
 anim=requestAnimationFrame(frame);
}
function showWinner(w){
 const mine=me && Number(me.id)===Number(w.userId);
 document.getElementById("winner").innerHTML=m
 ?`<div class="win">${mine?"🎉🎆🎉<br>SIZ G‘OLIB BO‘LDINGIZ!":"🏆 G‘OLIB"}<br>${esc(w.label||"")}</div>${mine?'<div class="confetti">🎆 🎉 ✨ 🎉 🎆</div>':""}`
 :`<div class="win">🏆 G‘OLIB<br>${esc(w.label||"")}</div>`;
}
async function start(){
 try{
   const r=await fetch('/api/watch',{
     method:"POST",headers:{"Content-Type":"application/json","x-telegram-init-data":tgInit},
     body:JSON.stringify({startApp:startParam})
   });
   const d=await r.json(); if(!r.ok) throw new Error(d.error||'Watch API xatosi'); meta={...meta,...d}; render();
   const token=(await (await fetch('/api/ably-token',{method:'POST',headers:{'Content-Type':'application/json','x-telegram-init-data':tgInit},body:JSON.stringify({startApp:startParam}),cache:'no-store'})).json());
   if(!token.keyName) throw new Error(token.error||'Realtime token xatosi');
   const ably=new Ably.Realtime.Promise({authCallback:(params,cb)=>cb(null,token)});
   channel=ably.channels.get(`giveaway:${meta.giveaway.id}`);
   await channel.subscribe("state",e=>{meta.state=e.data;render();});
   await channel.subscribe("viewers",e=>{document.getElementById("viewers").textContent=e.data.count;});
   await channel.subscribe("spin_start",e=>{meta.state=e.data;render();});
   await channel.subscribe("winner",e=>showWinner(e.data));
 }catch(e){document.getElementById("app").innerHTML=`<div class="card">Ulanishda xatolik: ${esc(e.message)}</div>`;}
}
getMeta().then(x=>{meta=x;render();start();});
</script></div></body></html>
