<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAMZ ESTET — Giveaway</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#060606;color:#fff;font-family:Inter,Arial,sans-serif}
.wrap{width:min(760px,94vw);margin:auto;padding:18px 0 40px}.top{text-align:center}
.logo{font-weight:950;letter-spacing:4px;font-size:27px}.sub{color:#888;margin-top:5px}
.card{margin-top:15px;background:#101010;border:1px solid #fff1;border-radius:22px;padding:18px;box-shadow:0 14px 45px #000}
.poster{width:100%;border-radius:17px;display:block;max-height:320px;object-fit:cover}
.title{font-size:29px;font-weight:950;margin:17px 0 6px}.desc{color:#aaa;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}.stat{background:#090909;border:1px solid #fff1;border-radius:14px;padding:12px}.num{font-size:24px;font-weight:950}.lbl{font-size:11px;color:#777;margin-top:3px}
.timer{font-size:38px;font-weight:950;text-align:center;margin:18px 0 8px}.status{text-align:center;font-weight:900}
.wheel{height:170px;margin:18px 0;overflow:hidden;position:relative;border:1px solid #333;border-radius:18px;background:#080808}
.pointer{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;z-index:5;box-shadow:0 0 15px #fff}
.track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:10px;will-change:transform}
.item{width:145px;flex:0 0 145px;padding:25px 8px;text-align:center;background:#151515;border:1px solid #333;border-radius:14px;font-weight:900}
.winner{font-size:30px;font-weight:950;text-align:center;padding:14px}.mine{font-size:38px}.empty{text-align:center;padding:60px 20px;color:#999}
button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;font-weight:950;font-size:15px;background:#fff;color:#111}
.small{color:#777;text-align:center;font-size:12px;margin-top:12px}
@media(max-width:500px){.stats{gap:6px}.num{font-size:20px}.title{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">RAMZ ESTET</div><div class="sub">HALOL GIVEAWAY • LIVE</div></div>
<div id="app"><div class="card empty">Giveaway yuklanmoqda...</div></div>
</div>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();

let data=null, ch=null, raf=0, me=tg?.initDataUnsafe?.user||null;
const startParam=String(tg?.initDataUnsafe?.start_param||"");
const startMatch=startParam.match(/^(join|watch)_(\d+)$/);
const deepGid=startMatch?Number(startMatch[2]):0;
const deepMode=startMatch?startMatch[1]:"";

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function fmt(ms){
  ms=Math.max(0,ms);
  const s=Math.floor(ms/1000),m=Math.floor(s/60),x=s%60;
  return `${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`;
}

function draw(){
  const a=document.getElementById("app");
  if(!data?.giveaway){
    a.innerHTML=`<div class="card empty"><div style="font-size:45px">🎁</div><h2>Hozir faol giveaway yo‘q</h2><div>Yangi giveaway boshlanganda shu yerda ko‘rinadi.</div></div>`;
    return;
  }
  const g=data.giveaway,s=data.state||{};
  a.innerHTML=`
  <div class="card">
    ${g.image_file_id?`<div class="small">Telegram poster rasmi mavjud</div>`:""}
    <div class="title">${esc(g.title)}</div>
    <div class="desc">${esc(g.description||"")}</div>
    <div class="stats">
      <div class="stat"><div class="num" id="pc">${data.participantCount}</div><div class="lbl">ISHTIROKCHI</div></div>
      <div class="stat"><div class="num">${g.total_rounds}</div><div class="lbl">G‘OLIB</div></div>
      <div class="stat"><div class="num" id="vc">${data.viewerCount}</div><div class="lbl">LIVE</div></div>
    </div>
    <div class="timer" id="timer">--:--</div>
    <div class="status" id="status">${s.status==="spinning"?"🎡 BARABAN AYLANMOQDA":s.status==="running"?"LIVE":"⏳ KUTILMOQDA"}</div>
    <button id="joinBtn" onclick="joinGiveaway()">🎉 QATNASHISH</button><div id="joinMsg" class="small"></div>
    <div class="wheel"><div class="pointer"></div><div id="track" class="track"></div></div>
    <div id="winner"></div>
    <div class="small">Giveaway #${g.id}</div>
  </div>`;
  updateTrack(s);tick();
}

function tick(){
  const t=document.getElementById("timer");if(!t||!data)return;
  const s=data.state||{},g=data.giveaway,now=Date.now();
  if(s.status==="scheduled" && g.start_at){
    t.textContent=fmt(new Date(g.start_at).getTime()-now);
    requestAnimationFrame(tick);
  }else if(s.status==="spinning"&&s.start_at){
    t.textContent="AYLANMOQDA";
  }else{
    t.textContent=s.status==="running"?"LIVE":"--:--";
  }
}

function build(list){
  const el=document.getElementById("track");if(!el)return;
  el.innerHTML=[...list,...list,...list].map(x=>`<div class="item">${esc(x)}</div>`).join("");
}

function updateTrack(s){
  const list=s?.participants||[];if(!list.length)return;
  build(list);
  if(s.status==="spinning"&&s.start_at)spin(s);
}

function spin(s){
  cancelAnimationFrame(raf);
  const el=document.getElementById("track");if(!el)return;
  const w=155, center=(document.querySelector(".wheel")?.clientWidth||600)/2-w/2;
  const idx=(Number(s.target_index)||0)+listOffset(s);
  const end=center-idx*w;
  const start=center-Number(s.currentIndex||0)*w;
  const startAt=Number(s.start_at),dur=Number(s.duration_ms||8000);
  function f(){
    const p=Math.max(0,Math.min(1,(Date.now()-startAt)/dur));
    const e=1-Math.pow(1-p,3);
    el.style.transform=`translateX(${start+(end-start)*e}px)`;
    if(p<1)raf=requestAnimationFrame(f);
  }
  raf=requestAnimationFrame(f);
}
function listOffset(s){return Math.max(0,Number((s.participants||[]).length));}

function winner(w){
  const mine=me&&Number(me.id)===Number(w.userId);
  document.getElementById("winner").innerHTML=mine
   ?`<div class="winner mine">🎆 🎉 🎆<br>SIZ G‘OLIB BO‘LDINGIZ!<br><span>${esc(w.label||"")}</span></div>`
   :`<div class="winner">🏆 G‘OLIB<br><span>${esc(w.label||"")}</span></div>`;
}

async function joinGiveaway(){
  if(!tg?.initData){document.getElementById("joinMsg").textContent="Telegram ichidan oching.";return;}
  if(!data?.giveaway)return;
  const btn=document.getElementById("joinBtn"); if(btn)btn.disabled=true;
  try{
    const r=await fetch("/api/join",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({gid:data.giveaway.id,initData:tg.initData})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Qatnashib bo‘lmadi");
    data.participantCount=d.participantCount;
    const pc=document.getElementById("pc"); if(pc)pc.textContent=d.participantCount;
    const msg=document.getElementById("joinMsg"); if(msg)msg.textContent="✅ Siz giveawayga qo‘shildingiz!";
    if(btn){btn.textContent="✅ QATNASHDINGIZ";btn.disabled=true;}
  }catch(e){if(btn)btn.disabled=false;const msg=document.getElementById("joinMsg");if(msg)msg.textContent="❌ "+e.message;}
}

async function load(){
  const q=deepGid?`?gid=${encodeURIComponent(deepGid)}`:"";
  const r=await fetch("/api/current-giveaway"+q,{cache:"no-store"});
  data=await r.json();draw();

  if(!data?.giveaway)return;
  if(deepMode==="join") setTimeout(joinGiveaway,100);
  const tok=await (await fetch("/api/ably-token")).json();
  const ably=new Ably.Realtime({
    authCallback:(params,cb)=>cb(null,tok)
  });
  ch=ably.channels.get(`giveaway:${data.giveaway.id}`);

  await ch.subscribe("state",e=>{data.state=e.data;draw();});
  await ch.subscribe("spin_start",e=>{data.state=e.data;draw();});
  await ch.subscribe("viewers",e=>{
    const el=document.getElementById("vc");if(el)el.textContent=e.data.count;
  });
  await ch.subscribe("winner",e=>winner(e.data));
}
load().catch(e=>{
 document.getElementById("app").innerHTML=`<div class="card empty">Ulanishda xatolik.<br>${esc(e.message)}</div>`;
});
</script>
</body></html>
