*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050505;color:#fff;overflow:hidden}body{background:radial-gradient(circle at 50% 10%,#310000 0,#100000 32%,#050505 72%);overscroll-behavior:none}.wrap{height:100svh;min-height:100svh;width:100%;margin:auto;padding:clamp(6px,1.5vh,18px) clamp(8px,3vw,28px);text-align:center;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;min-height:0}.brand{flex:0 0 auto;font-size:clamp(24px,6vw,56px);font-weight:950;letter-spacing:5px;text-shadow:0 0 20px #f0000033}.sub{color:#999;letter-spacing:2px;font-size:clamp(9px,1.8vw,13px);margin:3px 0 6px}.info{color:#aaa;font-size:clamp(10px,1.8vw,14px);margin:0 0 6px;min-height:18px;display:flex;justify-content:center;align-items:center}.notice{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:9px 15px;border:1px solid #ffffff14;border-radius:14px;background:linear-gradient(135deg,#ffffff0a,#ffffff04);box-shadow:0 8px 28px #0008}.notice.success{border-color:#9a760055;box-shadow:0 8px 28px #0008,0 0 28px #9a76001c}.notice .icon{width:20px;height:20px;flex:0 0 20px;color:#e7c65c}.notice strong{color:#fff;font-weight:800}.notice span{color:#bdbdbd}.stage{position:relative;width:min(720px,88vw,calc(100svh - 205px));height:min(720px,88vw,calc(100svh - 205px));margin:auto;flex:0 1 auto;min-height:0}.wheel{width:100%;height:100%;display:block;border-radius:50%;background:#111;border:8px solid #181818;box-shadow:0 0 0 4px #520000,0 0 55px #ff000033;transform:rotate(0deg);transform-origin:center;will-change:transform}.pointer{position:absolute;z-index:5;left:50%;top:-7px;transform:translateX(-50%);width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;border-bottom:52px solid #ff2222;filter:drop-shadow(0 0 9px #f00)}.center{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f33,#900,#250000);border:6px solid #111;font-weight:900;font-size:13px;box-shadow:0 0 25px #f0000066}.status{min-height:24px;margin:6px 0;font-weight:800;color:#aaa}.status.live{color:#ff3b3b;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}.card{width:min(720px,96vw);height:100%;min-height:0;margin:auto;padding:clamp(7px,1.5vh,16px);border:1px solid #ffffff12;border-radius:18px;background:#ffffff06}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{padding:9px 14px;background:#ffffff08;border-radius:12px;color:#aaa;display:inline-flex;align-items:center;gap:7px}.stat .icon{width:16px;height:16px;color:#e7c65c}.stat b{color:#fff}.names{display:flex;flex-wrap:wrap;max-height:clamp(34px,8vh,90px);overflow:hidden;gap:7px;justify-content:center;color:#aaa;font-size:13px;margin-top:12px}.name{padding:7px 10px;background:#ffffff08;border-radius:10px}.winner{font-size:clamp(30px,7vw,58px);font-weight:950;color:#ffd166;text-shadow:0 0 25px #ffb00088;margin:12px 0}.winner .winIcon{width:44px;height:44px;vertical-align:middle;margin-bottom:8px}.mine{color:#fff;text-shadow:0 0 30px #ff2222}.conn{position:fixed;right:12px;bottom:12px;padding:7px 11px;border-radius:18px;background:#000b;border:1px solid #fff1;color:#aaa;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}.dot.ok{background:#25d366;box-shadow:0 0 8px #25d366}.dot.bad{background:#f33}.empty{padding:clamp(20px,6vh,55px) 20px;color:#999}@media(max-width:600px){.stage{width:min(92vw,calc(100svh - 230px));height:min(92vw,calc(100svh - 230px))}.center{width:70px;height:70px;font-size:10px}.pointer{border-left-width:16px;border-right-width:16px;border-bottom-width:38px}}

<div class="wrap"><div class="brand">RAMZ ESTET</div><div class="sub">HALOL GIVEAWAY • REALTIME</div><div id="info" class="info">Realtime ulanish tayyorlanmoqda...</div>
<div id="app"><div class="card empty">Giveaway yuklanmoqda...</div></div></div>

<script>
(function(){
  const nativeError=console.error.bind(console), nativeWarn=console.warn.bind(console);
  let sending=false;
  function sendClientLog(payload){
    if(sending) return;
    sending=true;
    try{
      const body={...payload,level:payload.level||'error',url:location.href,page:location.pathname};
      const json=JSON.stringify(body);
      let sent=false;
      try{ if(navigator.sendBeacon){ sent=navigator.sendBeacon('/api/client-log',new Blob([json],{type:'application/json'})); } }catch(_){}
      if(!sent){ fetch('/api/client-log',{method:'POST',headers:{'Content-Type':'application/json'},body:json,keepalive:true}).then(r=>r.json()).then(x=>nativeError('[RAMZ LOG RESULT]',x)).catch(e=>nativeError('[RAMZ LOG SEND FAILED]',e)); }
    }finally{ setTimeout(()=>{sending=false},50); }
  }
  window.addEventListener('error',e=>sendClientLog({action:'window.error',message:e.message||'Client error',stack:e.error?.stack||'',line:e.lineno||0,column:e.colno||0}));
  window.addEventListener('unhandledrejection',e=>sendClientLog({action:'unhandledrejection',message:String(e.reason?.message||e.reason||'Unhandled rejection'),stack:e.reason?.stack||''}));
  console.error=function(...args){ nativeError(...args); sendClientLog({action:'console.error',message:args.map(x=>{try{return typeof x==='string'?x:JSON.stringify(x)}catch(_){return String(x)}}).join(' ').slice(0,1200),stack:new Error().stack||''}); };
  console.warn=function(...args){ nativeWarn(...args); sendClientLog({level:'warn',action:'console.warn',message:args.map(x=>String(x)).join(' ').slice(0,1200),stack:new Error().stack||''}); };
  window.RAMZ_REPORT_ERROR=(error,action='manual.error')=>sendClientLog({action,message:error?.message||String(error||'Unknown error'),stack:error?.stack||''});
  window.RAMZ_TEST_LOG=()=>{ console.error('RAMZ ESTET TEST ERROR'); };
})();
</script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1000;canvas.className='wheel';const wheelCtx=canvas.getContext('2d');
const app=document.getElementById('app'),info=document.getElementById('info'),dot=document.getElementById('dot'),connText=document.getElementById('connText');
let data=null,rotation=0,activeSpinId=0,raf=0,me=tg?.initDataUnsafe?.user||null,channel=null,joined=false;
function readTelegramContext(){
  const qs=new URLSearchParams(location.search);
  let init=tg?.initData||'';
  let start=tg?.initDataUnsafe?.start_param || tg?.initDataUnsafe?.startParam || qs.get('startapp') || qs.get('tgWebAppStartParam') || '';
  // Telegram may expose WebApp data in the URL hash in some clients.
  if(!init || !start){
    const hash=(location.hash||'').replace(/^#/,'');
    const hp=new URLSearchParams(hash);
    if(!init) init=hp.get('tgWebAppData') || hp.get('initData') || '';
    if(!start) start=hp.get('tgWebAppStartParam') || hp.get('startapp') || '';
  }
  // If tgWebAppData is present as a query/hash field, decode it before sending.
  try{ if(init && init.includes('%3D')) init=decodeURIComponent(init); }catch{}
  return {initData:init,startParam:start};
}
const ctx=readTelegramContext();
const initData=ctx.initData;
const startParam=ctx.startParam;
if(startParam){ try{ history.replaceState(null,'',location.pathname); }catch{} }
function authHeaders(){return {'content-type':'application/json','x-telegram-init-data':initData}}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setConn(ok){dot.className='dot '+(ok?'ok':'bad');connText.textContent=ok?'Live':'Ulanish uzildi'}
function svgIcon(name,cls='icon'){const a={user:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-3.3 3-5 6.5-5s5.8 1.7 6.5 5"/>',trophy:'<path d="M8 4h8v4.5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v2a3 3 0 0 0 3 3M16 6h3v2a3 3 0 0 1-3 3M12 13v4M8.5 20h7M10 17h4"/>',eye:'<path d="M2.5 12s3.2-5 9.5-5 9.5 5 9.5 5-3.2 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.4"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/>',spin:'<path d="M19 8a7.5 7.5 0 1 0 1 6"/><path d="M19 4v4h-4"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-6"/>',award:'<circle cx="12" cy="8" r="4.2"/><path d="M9.5 11.5 8 20l4-2 4 2-1.5-8.5"/>',live:'<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>',shield:'<path d="M12 3.5 19 6v5.2c0 4.5-2.7 7.2-7 9.3-4.3-2.1-7-4.8-7-9.3V6l7-2.5Z"/><path d="m8.7 12 2.1 2.1 4.5-4.5"/>',empty:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8M12 8v8"/>',error:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v6M12 16.5h.01"/>',crown:'<path d="m4 7 3 3 5-6 5 6 3-3-2 12H6L4 7Z"/><path d="M6 19h12"/>'};return '<svg class="'+cls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(a[name]||a.empty)+'</svg>'}
function notice(kind,title,detail){return '<div class="notice '+(kind||'')+'">'+svgIcon(kind==='success'?'check':kind==='error'?'error':'live')+'<div><strong>'+esc(title)+'</strong>'+(detail?'<div>'+esc(detail)+'</div>':'')+'</div></div>'}
function drawWheel(list){const n=list.length,c=500,r=488;wheelCtx.clearRect(0,0,1000,1000);if(!n){wheelCtx.fillStyle='#111';wheelCtx.beginPath();wheelCtx.arc(c,c,r,0,Math.PI*2);wheelCtx.fill();wheelCtx.fillStyle='#777';wheelCtx.font='bold 30px Arial';wheelCtx.textAlign='center';wheelCtx.fillText('KUTING...',c,c);return}const slice=Math.PI*2/n;for(let i=0;i<n;i++){const a=-Math.PI/2+i*slice;wheelCtx.beginPath();wheelCtx.moveTo(c,c);wheelCtx.arc(c,c,r,a,a+slice);wheelCtx.closePath();wheelCtx.fillStyle=i%2?'#720000':'#171717';wheelCtx.fill();wheelCtx.strokeStyle='#ffffff18';wheelCtx.lineWidth=2;wheelCtx.stroke();wheelCtx.save();wheelCtx.translate(c,c);wheelCtx.rotate(a+slice/2);wheelCtx.textAlign='right';wheelCtx.textBaseline='middle';const fs=n>30?14:n>20?17:n>12?20:24;wheelCtx.font=`900 ${fs}px Arial`;wheelCtx.fillStyle='#fff';let s=String(list[i]||'');if(s.length>18)s=s.slice(0,17)+'…';wheelCtx.fillText(s,r-30,0);wheelCtx.restore()}wheelCtx.beginPath();wheelCtx.arc(c,c,r,0,Math.PI*2);wheelCtx.strokeStyle='#ff2020';wheelCtx.lineWidth=8;wheelCtx.stroke()}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function render(){if(!data?.giveaway){app.innerHTML='<div class="card empty">'+svgIcon('empty','winIcon')+'<h2>Hozir faol giveaway yo‘q</h2></div>';return}const g=data.giveaway,s=data.state||{};app.innerHTML=`<div class="card"><div class="stats"><div class="stat">${svgIcon('user')} <b id="pc">${data.participantCount||0}</b> ishtirokchi</div><div class="stat">${svgIcon('trophy')} <b>${g.total_rounds}</b> g‘olib</div><div class="stat">${svgIcon('eye')} <b id="vc">${data.viewerCount||0}</b> live</div></div><div id="stage" class="stage"></div><div id="status" class="status">${s.status==='spinning'?'BARABAN AYLANMOQDA...':s.status==='finished'?'Yakunlandi':'KUTILMOQDA'}</div><div id="winner"></div><div id="names" class="names"></div></div>`;const stage=document.getElementById('stage');stage.appendChild(canvas);const p=document.createElement('div');p.className='pointer';stage.appendChild(p);const ce=document.createElement('div');ce.className='center';ce.innerHTML='RAMZ<br>ESTET';stage.appendChild(ce);drawWheel(s.participants||[]);showNames(s.participants||[]);if(s.status==='spinning')animateFromState(s)}
function showNames(list){const e=document.getElementById('names');if(!e)return;e.innerHTML=list.map(n=>`<span class="name">${esc(n)}</span>`).join('')}
function animateFromState(d){cancelAnimationFrame(raf);const list=Array.isArray(d.participants)?d.participants:[],n=list.length,idx=Number(d.targetIndex),duration=Number(d.durationMs)||8000,startAt=Number(d.startAt||d.start_at);if(!n||!Number.isInteger(idx)||idx<0||idx>=n||!startAt)return;const slice=360/n,target=360-(idx*slice+slice/2);let current=((rotation%360)+360)%360,delta=target-current;if(delta<0)delta+=360;const totalDelta=360*8+delta,baseRotation=rotation;const statusEl=document.getElementById('status');if(statusEl){statusEl.className='status live';statusEl.textContent='BARABAN AYLANMOQDA...'}function frame(){const e=Date.now()-startAt,p=Math.min(1,Math.max(0,e/duration)),ease=easeOutCubic(p);rotation=baseRotation+totalDelta*ease;canvas.style.transform=`rotate(${rotation}deg)`;if(p<1)raf=requestAnimationFrame(frame);else{rotation=baseRotation+totalDelta;canvas.style.transform=`rotate(${rotation}deg)`;const st=document.getElementById('status');if(st){st.className='status';st.textContent='G‘olib aniqlandi'};settleRound(Number(d.round||data?.state?.round||1))}}requestAnimationFrame(frame)}
function revealWinner(w){const el=document.getElementById('winner');if(!el)return;const mine=!!w?.isWinner || !!(me&&w&&Number(me.id)===Number(w.userId));el.innerHTML=mine?`<div class="winner mine">${svgIcon('crown','winIcon')}<br>SIZ G‘OLIB BO‘LDINGIZ!<br><span>${esc(w.winner||w.label||'')}</span></div>`:`<div class="winner">${svgIcon('trophy','winIcon')}<br>G‘OLIB<br><span>${esc(w.winner||w.label||'')}</span></div>`}
async function settleRound(round){const run=async()=>{try{const r=await fetch('/api/finish-round',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam,round})});if(r.status===425)setTimeout(run,500)}catch(e){setTimeout(run,1000)}};setTimeout(run,300)}
function readStartApp(){const raw=startParam||'';if(!raw)return null;return {mode:'auto',token:raw}}
async function doJoin(){if(!me?.id||!startParam)return;try{const r=await fetch('/api/join',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam})});const j=await r.json();if(j.ok){joined=true;const pc=document.getElementById('pc');if(pc)pc.textContent=j.participantCount;const title=String(data?.giveaway?.title||'Giveaway');info.innerHTML=notice('success','Qatnashuv tasdiqlandi','Siz “'+title+'” giveawayiga muvaffaqiyatli qo‘shildingiz. Ismingiz barabanda.')}else info.innerHTML=notice('error',j.error||'Qatnashishda xatolik','Qayta urinib ko‘ring.')}catch(e){console.error(e);info.textContent='Qatnashishda xatolik'}}
async function connect(){try{if(!data?.giveaway||!startParam)return;const tok=await (await fetch('/api/ably-token',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam}),cache:'no-store'})).json();if(!tok.keyName)throw new Error(tok.error||'Realtime token xatosi');const ably=new Ably.Realtime({authCallback:(_params,cb)=>cb(null,tok)});channel=ably.channels.get(`giveaway:${data.giveaway.id}`);channel.subscribe('round_start',m=>{const d=m.data||{};if(Number(d.giveawayId)!==Number(data.giveaway.id)||Number(d.spinId||0)<=activeSpinId)return;activeSpinId=Number(d.spinId);data.state={status:'spinning',round:d.round,total_rounds:d.totalRounds,spin_id:d.spinId,start_at:d.startAt,duration_ms:d.durationMs,target_index:d.targetIndex,participants:d.participants||[],winners:d.winners||[]};drawWheel(data.state.participants);showNames(data.state.participants);animateFromState({spinId:d.spinId,startAt:d.startAt,durationMs:d.durationMs,targetIndex:d.targetIndex,participants:d.participants||[]});});channel.subscribe('winner_reveal',async m=>{const w=m.data||{};const r=await fetch('/api/winner-status',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam,round:w.round})});const x=await r.json();revealWinner({winner:w.winner,userId:x.userId,isWinner:!!x.isWinner})});channel.subscribe('giveaway_finished',m=>{const st=document.getElementById('status');if(st)st.textContent='Giveaway yakunlandi';});channel.subscribe('viewers',m=>{const e=document.getElementById('vc');if(e)e.textContent=m.data?.count??0});ably.connection.on('connected',()=>setConn(true));ably.connection.on('disconnected',()=>setConn(false));ably.connection.on('failed',()=>setConn(false));setConn(true);const r=await fetch('/api/watch',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam})});if(r.ok){const x=await r.json();data.state=x.state||data.state;data.viewerCount=x.viewerCount||data.viewerCount;drawWheel(data.state?.participants||[]);showNames(data.state?.participants||[]);if(data.state?.status==='spinning')animateFromState(data.state)}}catch(e){console.error(e);setConn(false);info.textContent='Ulanishda xatolik: '+e.message}}
async function load(){const mode=readStartApp();if(!mode?.token){app.innerHTML='<div class="card empty">Telegram orqali giveaway havolasi bilan kiring.</div>';return}const r=await fetch('/api/current-giveaway',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:mode.token}),cache:'no-store'});data=await r.json();if(!r.ok)throw new Error(data.error||`API ${r.status}`);render();if(!data?.giveaway)return;if(data.mode==='join')await doJoin();await connect()}
load().catch(e=>{console.error(e);app.innerHTML='<div class="card empty">'+svgIcon('error','winIcon')+'<h2>Ulanishda xatolik</h2><div>Telegram Mini App havolasini qayta oching.</div></div>'});
</script></body></html>
