<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAMZ ESTET — Live Wheel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050505;color:#fff}body{overflow-x:hidden;background:radial-gradient(circle at 50% 10%,#310000 0,#100000 32%,#050505 72%)}
.wrap{width:min(980px,94vw);margin:auto;padding:18px 0 45px;text-align:center}.brand{font-size:clamp(32px,8vw,72px);font-weight:950;letter-spacing:5px;text-shadow:0 0 20px #f0000033}.sub{color:#999;letter-spacing:2px;font-size:13px;margin:7px 0 14px}.info{color:#aaa;font-size:14px;margin-bottom:16px}.stage{position:relative;width:min(720px,92vw);aspect-ratio:1;margin:auto}.wheel{width:100%;height:100%;display:block;border-radius:50%;background:#111;border:8px solid #181818;box-shadow:0 0 0 4px #520000,0 0 55px #ff000033;transform:rotate(0deg);transform-origin:center;will-change:transform}.pointer{position:absolute;z-index:5;left:50%;top:-7px;transform:translateX(-50%);width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;border-bottom:52px solid #ff2222;filter:drop-shadow(0 0 9px #f00)}.center{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f33,#900,#250000);border:6px solid #111;font-weight:900;font-size:13px;box-shadow:0 0 25px #f0000066}.status{min-height:30px;margin:20px 0;font-weight:800;color:#aaa}.status.live{color:#ff3b3b;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}.card{width:min(720px,94vw);margin:auto;padding:16px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff06}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{padding:9px 14px;background:#ffffff08;border-radius:12px;color:#aaa}.stat b{color:#fff}.names{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;color:#aaa;font-size:13px;margin-top:12px}.name{padding:7px 10px;background:#ffffff08;border-radius:10px}.winner{font-size:clamp(30px,7vw,58px);font-weight:950;color:#ffd166;text-shadow:0 0 25px #ffb00088;margin:12px 0}.mine{color:#fff;text-shadow:0 0 30px #ff2222}.conn{position:fixed;right:12px;bottom:12px;padding:7px 11px;border-radius:18px;background:#000b;border:1px solid #fff1;color:#aaa;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}.dot.ok{background:#25d366;box-shadow:0 0 8px #25d366}.dot.bad{background:#f33}.empty{padding:55px 20px;color:#999}@media(max-width:600px){.center{width:70px;height:70px;font-size:10px}.pointer{border-left-width:16px;border-right-width:16px;border-bottom-width:38px}}
</style></head><body>
<div class="wrap"><div class="brand">RAMZ ESTET</div><div class="sub">HALOL GIVEAWAY • LIVE</div><div id="info" class="info">Live ulanish tayyorlanmoqda...</div>
<div id="app"><div class="card empty">Giveaway yuklanmoqda...</div></div></div>
<div class="conn"><span id="dot" class="dot bad"></span><span id="connText">Ulanmoqda...</span></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1000;canvas.className='wheel';const ctx=canvas.getContext('2d');
const app=document.getElementById('app'),info=document.getElementById('info'),dot=document.getElementById('dot'),connText=document.getElementById('connText');
let data=null,rotation=0,activeSpinId=0,raf=0,me=tg?.initDataUnsafe?.user||null,channel=null,joined=false;
const initData=tg?.initData||'';
const startParam=tg?.initDataUnsafe?.start_param||'';
function authHeaders(){return {'content-type':'application/json','x-telegram-init-data':initData}}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setConn(ok){dot.className='dot '+(ok?'ok':'bad');connText.textContent=ok?'Live':'Ulanish yo‘q'}
function drawWheel(list){const n=list.length,c=500,r=488;ctx.clearRect(0,0,1000,1000);if(!n){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#777';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('KUTING...',c,c);return}const slice=Math.PI*2/n;for(let i=0;i<n;i++){const a=-Math.PI/2+i*slice;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+slice);ctx.closePath();ctx.fillStyle=i%2?'#720000':'#171717';ctx.fill();ctx.strokeStyle='#ffffff18';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(a+slice/2);ctx.textAlign='right';ctx.textBaseline='middle';const fs=n>30?14:n>20?17:n>12?20:24;ctx.font=`900 ${fs}px Arial`;ctx.fillStyle='#fff';let s=String(list[i]||'');if(s.length>18)s=s.slice(0,17)+'…';ctx.fillText(s,r-30,0);ctx.restore()}ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.strokeStyle='#ff2020';ctx.lineWidth=8;ctx.stroke()}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function render(){if(!data?.giveaway){app.innerHTML='<div class="card empty"><div style="font-size:45px">🎁</div><h2>Hozir faol giveaway yo‘q</h2></div>';return}const g=data.giveaway,s=data.state||{};app.innerHTML=`<div class="card"><div class="stats"><div class="stat">👥 <b id="pc">${data.participantCount||0}</b> ishtirokchi</div><div class="stat">🏆 <b>${g.total_rounds}</b> g‘olib</div><div class="stat">👁 <b id="vc">${data.viewerCount||0}</b> live</div></div><div id="stage" class="stage"></div><div id="status" class="status">${s.status==='spinning'?'🎰 BARABAN AYLANMOQDA...':s.status==='finished'?'🎉 Yakunlandi':'⏳ KUTILMOQDA'}</div><div id="winner"></div><div id="names" class="names"></div></div>`;const stage=document.getElementById('stage');stage.appendChild(canvas);const p=document.createElement('div');p.className='pointer';stage.appendChild(p);const ce=document.createElement('div');ce.className='center';ce.innerHTML='RAMZ<br>ESTET';stage.appendChild(ce);drawWheel(s.participants||[]);showNames(s.participants||[]);if(s.status==='spinning')animateFromState(s)}
function showNames(list){const e=document.getElementById('names');if(!e)return;e.innerHTML=list.map(n=>`<span class="name">${esc(n)}</span>`).join('')}
function animateFromState(d){cancelAnimationFrame(raf);const list=Array.isArray(d.participants)?d.participants:[],n=list.length,idx=Number(d.targetIndex),duration=Number(d.durationMs)||8000,startAt=Number(d.startAt||d.start_at);if(!n||!Number.isInteger(idx)||idx<0||idx>=n||!startAt)return;const slice=360/n,target=360-(idx*slice+slice/2);let current=((rotation%360)+360)%360,delta=target-current;if(delta<0)delta+=360;const totalDelta=360*8+delta,baseRotation=rotation;const statusEl=document.getElementById('status');if(statusEl){statusEl.className='status live';statusEl.textContent='🎰 BARABAN AYLANMOQDA...'}function frame(){const e=Date.now()-startAt,p=Math.min(1,Math.max(0,e/duration)),ease=easeOutCubic(p);rotation=baseRotation+totalDelta*ease;canvas.style.transform=`rotate(${rotation}deg)`;if(p<1)raf=requestAnimationFrame(frame);else{rotation=baseRotation+totalDelta;canvas.style.transform=`rotate(${rotation}deg)`;const st=document.getElementById('status');if(st){st.className='status';st.textContent='🎉 G‘olib aniqlandi'};settleRound(Number(d.round||data?.state?.round||1))}}requestAnimationFrame(frame)}
function revealWinner(w){const el=document.getElementById('winner');if(!el)return;const mine=me&&w&&Number(me.id)===Number(w.userId);el.innerHTML=mine?`<div class="winner mine">🎆 🎉 🎆<br>SIZ G‘OLIB BO‘LDINGIZ!<br><span>${esc(w.winner||w.label||'')}</span></div>`:`<div class="winner">🏆 G‘OLIB<br><span>${esc(w.winner||w.label||'')}</span></div>`}
async function settleRound(round){const run=async()=>{try{const r=await fetch('/api/finish-round',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam,round})});if(r.status===425)setTimeout(run,500)}catch(e){setTimeout(run,1000)}};setTimeout(run,300)}
function readStartApp(){const raw=startParam||'';if(!raw)return null;const action=raw.startsWith('v1.')?'watch':'watch';return {mode:action,token:raw}}
async function doJoin(){if(!me?.id||!startParam)return;try{const r=await fetch('/api/join',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam})});const j=await r.json();if(j.ok){joined=true;const pc=document.getElementById('pc');if(pc)pc.textContent=j.participantCount;info.textContent='🎉 Siz giveawayga qatnashdingiz!'}else info.textContent=j.error||'Qatnashishda xatolik'}catch(e){console.error(e);info.textContent='Qatnashishda xatolik'}}
async function connect(){try{if(!data?.giveaway||!startParam)return;const tok=await (await fetch('/api/ably-token',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam}),cache:'no-store'})).json();if(!tok.keyName)throw new Error(tok.error||'Realtime token xatosi');const ably=new Ably.Realtime({authCallback:(_params,cb)=>cb(null,tok)});channel=ably.channels.get(`giveaway:${data.giveaway.id}`);channel.subscribe('round_start',m=>{const d=m.data||{};if(Number(d.giveawayId)!==Number(data.giveaway.id)||Number(d.spinId||0)<=activeSpinId)return;activeSpinId=Number(d.spinId);data.state={status:'spinning',round:d.round,total_rounds:d.totalRounds,spin_id:d.spinId,start_at:d.startAt,duration_ms:d.durationMs,target_index:d.targetIndex,participants:d.participants||[],winners:d.winners||[]};drawWheel(data.state.participants);showNames(data.state.participants);animateFromState({spinId:d.spinId,startAt:d.startAt,durationMs:d.durationMs,targetIndex:d.targetIndex,participants:d.participants||[]});});channel.subscribe('winner_reveal',async m=>{const w=m.data||{};const r=await fetch('/api/winner-status',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam,round:w.round})});const x=await r.json();revealWinner({winner:w.winner,isWinner:!!x.isWinner})});channel.subscribe('giveaway_finished',m=>{const st=document.getElementById('status');if(st)st.textContent='🎉 Giveaway yakunlandi';});channel.subscribe('viewers',m=>{const e=document.getElementById('vc');if(e)e.textContent=m.data?.count??0});ably.connection.on('connected',()=>setConn(true));ably.connection.on('disconnected',()=>setConn(false));ably.connection.on('failed',()=>setConn(false));setConn(true);const r=await fetch('/api/watch',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:startParam})});if(r.ok){const x=await r.json();data.state=x.state||data.state;data.viewerCount=x.viewerCount||data.viewerCount;drawWheel(data.state?.participants||[]);showNames(data.state?.participants||[]);if(data.state?.status==='spinning')animateFromState(data.state)}}catch(e){console.error(e);setConn(false);info.textContent='Ulanishda xatolik: '+e.message}}
async function load(){const mode=readStartApp();if(!mode?.token){app.innerHTML='<div class="card empty">Telegram orqali giveaway havolasi bilan kiring.</div>';return}const r=await fetch('/api/current-giveaway',{method:'POST',headers:authHeaders(),body:JSON.stringify({startApp:mode.token}),cache:'no-store'});data=await r.json();if(!r.ok)throw new Error(data.error||'Giveaway yuklanmadi');render();if(!data?.giveaway)return;if(data.mode==='join')await doJoin();await connect()}
load().catch(e=>{console.error(e);app.innerHTML='<div class="card empty">Ulanishda xatolik. Telegram Mini App havolasini qayta oching.</div>'});
</script></body></html>
