<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMZ ESTET — Giveaway</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at center,#26090e,#080506 70%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}.app{width:min(900px,94%);text-align:center;padding:35px 0}.logo{font-size:clamp(45px,10vw,85px);font-weight:900;letter-spacing:8px}.estet{color:#ff3045;letter-spacing:12px;font-weight:bold}.info{margin:25px 0;color:#bbb}.wheel-box{width:min(650px,90vw);aspect-ratio:1;margin:30px auto;position:relative}canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #160608,0 0 0 11px #a7192c,0 0 60px rgba(255,30,50,.35);transition:transform 6s cubic-bezier(.12,.78,.18,1)}.pointer{position:absolute;z-index:5;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:45px solid #ff3045}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;background:#a91428;border:5px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 0 30px #ff3045}.status{font-size:20px;color:#aaa;min-height:30px}.winners{margin-top:30px}.winner{max-width:500px;margin:10px auto;padding:16px;border-radius:12px;background:#17090c;border:1px solid #65202b;display:flex;justify-content:space-between}.star{color:#ffd84d;font-weight:bold}
</style></head><body><div class="app"><div class="logo">RAMZ</div><div class="estet">ESTET</div><div class="info">🎁 HALOL GIVEAWAY · 🏆 5 G‘OLIB · ⭐ 15 STARS</div><div class="wheel-box"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas><div class="center">RAMZ<br>ESTET</div></div><div class="status" id="status">Giveaway boshlanishini kuting...</div><div class="winners"><h2>🏆 G‘OLIBLAR</h2><div id="winnerList"></div></div></div>
<script>
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");let participants=[],lastSpin=0,rotation=0,spinning=false;
const colors=["#b8182d","#111","#e52d40","#292929","#8e1020","#151515"];
async function loadParticipants(){try{const r=await fetch("/api/public-participants?t="+Date.now()),d=await r.json();participants=d.participants||[];drawWheel()}catch(e){}}
function drawWheel(){ctx.clearRect(0,0,700,700);if(!participants.length){ctx.fillStyle="#151515";ctx.beginPath();ctx.arc(350,350,335,0,Math.PI*2);ctx.fill();return}const n=participants.length,s=Math.PI*2/n;participants.forEach((name,i)=>{const a=i*s-Math.PI/2;ctx.beginPath();ctx.moveTo(350,350);ctx.arc(350,350,335,a,a+s);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="#ff5968";ctx.stroke();ctx.save();ctx.translate(350,350);ctx.rotate(a+s/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 14px Arial";let t=name.length>18?name.slice(0,17)+"…":name;ctx.fillText(t,315,5);ctx.restore()})}
function spinToWinner(username){if(spinning)return;const i=participants.indexOf(username);if(i<0)return;spinning=true;const slice=360/participants.length;rotation+=360*7+(360-(i*slice+slice/2));canvas.style.transform=`rotate(${rotation}deg)`;document.getElementById("status").textContent="🎡 BARABAN AYLANMOQDA...";setTimeout(()=>{document.getElementById("status").textContent=`🏆 G‘OLIB: ${username} — ⭐ 15 STARS`;spinning=false;loadParticipants()},6200)}
function renderWinners(ws){const el=document.getElementById("winnerList");el.innerHTML="";ws.forEach((w,i)=>{const d=document.createElement("div");d.className="winner";d.innerHTML=`<span>🏆 ${i+1}. ${esc(w.username)}</span><span class="star">⭐ ${w.prize}</span>`;el.appendChild(d)})}
function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}
async function poll(){try{const r=await fetch("/api/state?t="+Date.now()),d=await r.json();if(d.state){renderWinners(d.winners||[]);if(d.state.current_spin>lastSpin&&d.state.status==="spinning"){lastSpin=d.state.current_spin;await loadParticipants();spinToWinner(d.state.winner)}if(d.state.status==="finished")document.getElementById("status").textContent="🎉 GIVEAWAY YAKUNLANDI!"}}catch(e){}}
loadParticipants();poll();setInterval(poll,700);
</script></body></html>
