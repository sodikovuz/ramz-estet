<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMZ ESTET — Giveaway</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at center,#26090e,#080506 70%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}.app{width:min(900px,94%);text-align:center;padding:35px 0}.logo{font-size:clamp(45px,10vw,85px);font-weight:900;letter-spacing:8px}.estet{color:#ff3045;letter-spacing:12px;font-weight:bold}.info{margin:25px 0;color:#bbb}.wheel-box{width:min(650px,90vw);aspect-ratio:1;margin:30px auto;position:relative}canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #160608,0 0 0 11px #a7192c,0 0 60px rgba(255,30,50,.35);transition:transform 6s cubic-bezier(.12,.78,.18,1)}.pointer{position:absolute;z-index:5;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:45px solid #ff3045}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;background:#a91428;border:5px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 0 30px #ff3045}.status{font-size:20px;color:#aaa;min-height:30px}.winners{margin-top:30px}.winner{max-width:500px;margin:10px auto;padding:16px;border-radius:12px;background:#17090c;border:1px solid #65202b;display:flex;justify-content:space-between}.star{color:#ffd84d;font-weight:bold}
</style></head><body><div class="app"><div class="logo">RAMZ</div><div class="estet">ESTET</div><div class="info">🎁 HALOL GIVEAWAY · 🏆 5 G‘OLIB · ⭐ 15 STARS</div><div class="wheel-box"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas><div class="center">RAMZ<br>ESTET</div></div><div class="status" id="status">Giveaway boshlanishini kuting...</div><div class="winners"><h2>🏆 G‘OLIBLAR</h2><div id="winnerList"></div></div></div>
<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let participants = [];
let lastSpinId = 0;
let rotation = 0;
let spinning = false;

const colors = [
    "#b8182d",
    "#111111",
    "#e52d40",
    "#292929",
    "#8e1020",
    "#151515"
];

async function loadParticipants() {

    try {

        const response =
            await fetch(
                "/api/public-participants?t=" +
                Date.now()
            );

        const data =
            await response.json();

        participants =
            data.participants || [];

        drawWheel();

    } catch (error) {

        console.error(error);

    }
}


function drawWheel() {

    ctx.clearRect(
        0,
        0,
        700,
        700
    );

    if (!participants.length) {

        ctx.fillStyle = "#151515";

        ctx.beginPath();

        ctx.arc(
            350,
            350,
            335,
            0,
            Math.PI * 2
        );

        ctx.fill();

        return;
    }

    const total =
        participants.length;

    const slice =
        Math.PI * 2 / total;

    participants.forEach(
        (name, i) => {

            const start =
                i * slice -
                Math.PI / 2;

            const end =
                start + slice;

            ctx.beginPath();

            ctx.moveTo(350, 350);

            ctx.arc(
                350,
                350,
                335,
                start,
                end
            );

            ctx.closePath();

            ctx.fillStyle =
                colors[i % colors.length];

            ctx.fill();

            ctx.strokeStyle =
                "#ff5968";

            ctx.lineWidth = 2;

            ctx.stroke();

            ctx.save();

            ctx.translate(
                350,
                350
            );

            ctx.rotate(
                start + slice / 2
            );

            ctx.textAlign =
                "right";

            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "bold 14px Arial";

            let text = name;

            if (text.length > 18) {

                text =
                    text.substring(0, 17) +
                    "…";
            }

            ctx.fillText(
                text,
                315,
                5
            );

            ctx.restore();
        }
    );
}


/*
    SERVERDAN SPINNI TEKSHIRADI
*/

async function checkState() {

    try {

        const response =
            await fetch(
                "/api/state?t=" +
                Date.now()
            );

        const data =
            await response.json();

        if (!data.state) return;

        const state =
            data.state;

        renderWinners(
            data.winners || []
        );


        /*
            YANGI SPIN BOSHLANGAN
        */

        if (
            state.status === "spinning" &&
            state.spin_id > lastSpinId
        ) {

            lastSpinId =
                state.spin_id;

            await loadParticipants();

            startViewerSpin(
                state
            );
        }


        if (
            state.status === "finished"
        ) {

            document.getElementById(
                "status"
            ).textContent =
                "🎉 GIVEAWAY YAKUNLANDI!";
        }

    } catch (error) {

        console.error(error);

    }
}


/*
    VIEWERDA BARABAN AYLANADI
*/

function startViewerSpin(state) {

    if (spinning) return;

    const winner =
        state.winner;

    /*
        Winner yangi winner ro‘yxatida
        o‘chirilgani uchun viewer
        aynan eski ro‘yxat bilan
        hisoblaydi.
        
        Shuning uchun winnerIndex
        serverdan kelgani yaxshi.
    */

    spinning = true;

    const winnerIndex =
        state.winnerIndex;

    const total =
        participants.length + 1;

    const slice =
        360 / total;

    /*
        G‘olib segmentini tepaga olib kelamiz.
    */

    const target =
        360 -
        (
            winnerIndex * slice +
            slice / 2
        );

    const extraSpins =
        360 * 7;

    rotation +=
        extraSpins +
        target;

    canvas.style.transition =
        `transform ${state.spin_duration}ms cubic-bezier(.12,.78,.18,1)`;

    canvas.style.transform =
        `rotate(${rotation}deg)`;

    document.getElementById(
        "status"
    ).textContent =
        "🎡 BARABAN AYLANMOQDA...";


    setTimeout(() => {

        document.getElementById(
            "status"
        ).textContent =
            `🏆 ${winner} — ⭐ 15 STARS`;

        spinning = false;

        loadParticipants();

    }, state.spin_duration + 100);

}


/*
    G‘OLIBLAR
*/

function renderWinners(winners) {

    const list =
        document.getElementById(
            "winnerList"
        );

    list.innerHTML = "";

    winners.forEach(
        (winner, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "winner";

            item.innerHTML = `
                <span>
                    🏆 ${index + 1}.
                    ${escapeHtml(
                        winner.username
                    )}
                </span>

                <span class="star">
                    ⭐ ${winner.prize}
                </span>
            `;

            list.appendChild(item);
        }
    );
}


function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}


/*
    Har 500ms serverni tekshiradi.
*/

setInterval(
    checkState,
    500
);

loadParticipants();

checkState();

</script></body></html>
