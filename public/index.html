<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAMZ ESTET — Giveaway</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 15%, #300000 0%, #100000 35%, #050505 75%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: min(1000px, 94%);
      margin: auto;
      padding: 30px 0 60px;
      text-align: center;
    }

    .logo {
      font-size: clamp(34px, 8vw, 68px);
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 8px;

      text-shadow:
        0 0 12px rgba(255, 0, 0, .6),
        0 0 35px rgba(255, 0, 0, .3);
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    /* =========================
       WHEEL
    ========================= */

    .wheel-wrapper {
      position: relative;

      width: min(700px, 92vw);
      height: min(700px, 92vw);

      margin: 0 auto 30px;
    }

    #wheel {
      display: block;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      background: #111;

      border: 8px solid #1b1b1b;

      box-shadow:
        0 0 0 4px #570000,
        0 0 35px rgba(255, 0, 0, .35),
        0 0 90px rgba(255, 0, 0, .12);

      /*
        MUHIM:
        transform JS orqali o'zgaradi.
      */
      transform: rotate(0deg);

      transform-origin: center center;

      will-change: transform;
    }

    /* =========================
       POINTER
    ========================= */

    .pointer {
      position: absolute;

      z-index: 20;

      top: -8px;
      left: 50%;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-top: 0;
      border-bottom: 55px solid #ff2020;

      filter:
        drop-shadow(0 0 8px #ff0000)
        drop-shadow(0 0 20px rgba(255, 0, 0, .6));
    }

    .pointer::after {
      content: "";

      position: absolute;

      left: -8px;
      top: 45px;

      width: 16px;
      height: 16px;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 8px #fff,
        0 0 18px #ff0000;
    }

    /* =========================
       CENTER
    ========================= */

    .center {
      position: absolute;

      z-index: 15;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 100px;
      height: 100px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        radial-gradient(
          circle,
          #ff2525 0%,
          #8d0000 55%,
          #260000 100%
        );

      border: 6px solid #111;

      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;

      box-shadow:
        0 0 20px rgba(255, 0, 0, .7),
        inset 0 0 20px rgba(0, 0, 0, .5);
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      min-height: 30px;

      margin: 10px auto 25px;

      font-size: 18px;
      font-weight: 700;

      color: #aaa;

      transition:
        color .3s ease,
        transform .3s ease;
    }

    .status.spinning {
      color: #ff3030;

      animation: statusPulse 1s infinite;
    }

    .status.finished {
      color: #fff;
    }

    @keyframes statusPulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .45;
      }
    }

    /* =========================
       WINNER
    ========================= */

    .winner-box {
      width: min(600px, 92%);

      margin: 0 auto 35px;

      padding: 22px;

      border-radius: 18px;

      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,0,0,.25);

      box-shadow:
        0 0 30px rgba(255,0,0,.08);

      opacity: 0;

      transform: scale(.92) translateY(10px);

      pointer-events: none;

      transition:
        opacity .45s ease,
        transform .45s ease;
    }

    .winner-box.show {
      opacity: 1;

      transform:
        scale(1)
        translateY(0);
    }

    .winner-label {
      color: #777;

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 8px;
    }

    .winner-name {
      color: #ff3030;

      font-size: clamp(25px, 6vw, 45px);

      font-weight: 900;

      word-break: break-word;

      text-shadow:
        0 0 15px rgba(255,0,0,.5);
    }

    .prize {
      margin-top: 9px;

      color: #ccc;

      font-size: 15px;
    }

    /* =========================
       WINNER LIST
    ========================= */

    .winners {
      width: min(700px, 92%);

      margin: auto;
    }

    .winners h2 {
      margin-bottom: 15px;

      font-size: 20px;
    }

    #winnerList {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));

      gap: 10px;
    }

    .winner-item {
      padding: 14px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid rgba(255,255,255,.07);

      color: #ddd;

      animation:
        winnerIn .35s ease;
    }

    @keyframes winnerIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       CONNECTION
    ========================= */

    .connection {
      position: fixed;

      right: 14px;
      bottom: 14px;

      display: flex;

      align-items: center;

      gap: 7px;

      padding: 8px 12px;

      border-radius: 20px;

      background:
        rgba(0,0,0,.7);

      border:
        1px solid rgba(255,255,255,.08);

      color: #999;

      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #777;
    }

    .dot.online {
      background: #25d366;

      box-shadow:
        0 0 8px #25d366;
    }

    .dot.offline {
      background: #ff3030;

      box-shadow:
        0 0 8px #ff3030;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding-top: 22px;
      }

      .wheel-wrapper {
        width: 92vw;
        height: 92vw;
      }

      .pointer {
        border-left-width: 17px;
        border-right-width: 17px;
        border-bottom-width: 40px;
      }

      .pointer::after {
        top: 31px;
      }

      .center {
        width: 70px;
        height: 70px;

        font-size: 10px;
      }

      .status {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      RAMZ ESTET
    </div>

    <div class="subtitle">
      HALOL GIVEAWAY
    </div>


    <!-- =====================
         WHEEL
    ====================== -->

    <div class="wheel-wrapper">

      <div class="pointer"></div>

      <canvas
        id="wheel"
        width="1000"
        height="1000">
      </canvas>

      <div class="center">
        RAMZ<br>
        ESTET
      </div>

    </div>


    <!-- =====================
         STATUS
    ====================== -->

    <div
      id="status"
      class="status">
      Giveaway tayyor...
    </div>


    <!-- =====================
         WINNER
    ====================== -->

    <div
      id="winnerBox"
      class="winner-box">

      <div class="winner-label">
        🎉 G'OLIB
      </div>

      <div
        id="winnerName"
        class="winner-name">
        —
      </div>

      <div class="prize">
        ⭐ 15 Telegram Stars
      </div>

    </div>


    <!-- =====================
         WINNER LIST
    ====================== -->

    <section class="winners">

      <h2>
        🏆 G'oliblar
      </h2>

      <div id="winnerList"></div>

    </section>

  </main>


  <!-- =====================
       CONNECTION
  ====================== -->

  <div class="connection">

    <span
      id="connectionDot"
      class="dot offline">
    </span>

    <span id="connectionText">
      Ulanmoqda...
    </span>

  </div>


<script>

  /*
  =====================================================
  VARIABLES
  =====================================================
  */

  const canvas =
    document.getElementById("wheel");

  const ctx =
    canvas.getContext("2d");

  const statusEl =
    document.getElementById("status");

  const winnerBox =
    document.getElementById("winnerBox");

  const winnerName =
    document.getElementById("winnerName");

  const winnerList =
    document.getElementById("winnerList");

  const connectionDot =
    document.getElementById("connectionDot");

  const connectionText =
    document.getElementById("connectionText");


  let participants = [];

  let rotation = 0;

  let spinning = false;

  let currentSpinId = 0;


  /*
  =====================================================
  DRAW WHEEL
  =====================================================
  */

  function drawWheel(list) {

    const size =
      canvas.width;

    const center =
      size / 2;

    const radius =
      size / 2 - 12;


    ctx.clearRect(
      0,
      0,
      size,
      size
    );


    if (
      !Array.isArray(list) ||
      list.length === 0
    ) {

      drawEmptyWheel();

      return;
    }


    const slice =
      (Math.PI * 2) / list.length;


    for (
      let i = 0;
      i < list.length;
      i++
    ) {

      const start =
        i * slice -
        Math.PI / 2;

      const end =
        start + slice;


      /*
        SEGMENT
      */

      ctx.beginPath();

      ctx.moveTo(
        center,
        center
      );

      ctx.arc(
        center,
        center,
        radius,
        start,
        end
      );

      ctx.closePath();


      /*
        RED / BLACK
      */

      ctx.fillStyle =
        i % 2 === 0
          ? "#171717"
          : "#720000";


      ctx.fill();


      ctx.strokeStyle =
        "rgba(255,255,255,.12)";

      ctx.lineWidth = 2;

      ctx.stroke();


      /*
        USERNAME
      */

      ctx.save();


      ctx.translate(
        center,
        center
      );


      ctx.rotate(
        start + slice / 2
      );


      ctx.textAlign =
        "right";

      ctx.textBaseline =
        "middle";


      let fontSize = 25;

      if (list.length > 25) {
        fontSize = 15;
      } else if (list.length > 15) {
        fontSize = 19;
      }


      ctx.font =
        `900 ${fontSize}px Arial`;

      ctx.fillStyle =
        "#fff";


      ctx.shadowColor =
        "rgba(0,0,0,.9)";

      ctx.shadowBlur = 5;


      let name =
        typeof list[i] === "object"
          ? list[i].username
          : list[i];


      name =
        String(name || "");


      if (name.length > 18) {

        name =
          name.substring(0, 17) +
          "…";

      }


      ctx.fillText(
        name,
        radius - 30,
        0
      );


      ctx.restore();

    }


    /*
      OUTER RING
    */

    ctx.beginPath();

    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "#ff2020";

    ctx.lineWidth = 8;

    ctx.stroke();


    /*
      CENTER CIRCLE
    */

    ctx.beginPath();

    ctx.arc(
      center,
      center,
      58,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#111";

    ctx.fill();

  }


  /*
  =====================================================
  EMPTY WHEEL
  =====================================================
  */

  function drawEmptyWheel() {

    const size =
      canvas.width;

    const center =
      size / 2;

    const radius =
      size / 2 - 12;


    ctx.clearRect(
      0,
      0,
      size,
      size
    );


    ctx.beginPath();

    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#111";

    ctx.fill();


    ctx.strokeStyle =
      "#550000";

    ctx.lineWidth = 8;

    ctx.stroke();


    ctx.fillStyle =
      "#666";

    ctx.font =
      "bold 30px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      "KUTING...",
      center,
      center
    );

  }


  /*
  =====================================================
  GET PARTICIPANTS
  =====================================================
  */

  async function loadParticipants() {

    try {

      const response =
        await fetch(
          "/api/public-participants?_=" +
          Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "Participants API error"
        );
      }


      const data =
        await response.json();


      if (Array.isArray(data)) {

        participants = data;

      } else if (
        Array.isArray(data.participants)
      ) {

        participants =
          data.participants;

      } else {

        participants = [];

      }


      /*
        Faqat spin bo'lmaganda
        wheelni chizamiz.
      */

      if (!spinning) {

        drawWheel(
          participants
        );

      }


    } catch (error) {

      console.error(
        error
      );

    }

  }


  /*
  =====================================================
  GET STATE
  =====================================================
  */

  async function loadState() {

    try {

      const response =
        await fetch(
          "/api/state?_=" +
          Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "State API error"
        );
      }


      const state =
        await response.json();


      setOnline(true);


      return state;


    } catch (error) {

      console.error(
        error
      );

      setOnline(false);

      return null;

    }

  }


  /*
  =====================================================
  CONNECTION
  =====================================================
  */

  function setOnline(value) {

    if (value) {

      connectionDot.className =
        "dot online";

      connectionText.textContent =
        "Online";

    } else {

      connectionDot.className =
        "dot offline";

      connectionText.textContent =
        "Offline";

    }

  }


  /*
  =====================================================
  START SPIN
  =====================================================
  */

  function startSpin(state) {

    /*
      Agar allaqachon spin bo'lsa,
      ikkinchi marta boshlamaydi.
    */

    if (spinning) {
      return;
    }


    const total =
      participants.length;


    const winnerIndex =
      Number(
        state.winner_index
      );


    console.log(
      "START SPIN",
      {
        total,
        winnerIndex,
        winner: state.winner
      }
    );


    /*
      Data noto'g'ri bo'lsa
      spin qilmaymiz.
    */

    if (
      total <= 0 ||
      !Number.isInteger(winnerIndex) ||
      winnerIndex < 0 ||
      winnerIndex >= total
    ) {

      console.error(
        "winner_index xato:",
        {
          total,
          winnerIndex,
          participants
        }
      );

      return;

    }


    spinning = true;


    /*
      Winner oynasini yashiramiz.
    */

    winnerBox.classList.remove(
      "show"
    );


    statusEl.className =
      "status spinning";

    statusEl.textContent =
      "🎰 Baraban aylanmoqda...";


    /*
      Har bir segment burchagi.
    */

    const slice =
      360 / total;


    /*
      Winner segment markazi.
    */

    const target =
      360 -
      (
        winnerIndex * slice +
        slice / 2
      );


    /*
      Hozirgi rotation.
    */

    let current =
      rotation % 360;


    if (current < 0) {
      current += 360;
    }


    /*
      Targetgacha oldinga boramiz.
    */

    let difference =
      target - current;


    if (difference < 0) {

      difference += 360;

    }


    /*
      8 TA TO'LIQ AYLANISH
    */

    const fullSpins =
      360 * 8;


    const finalRotation =
      rotation +
      fullSpins +
      difference;


    /*
      MUHIM QISM:

      Transition aynan shu yerda
      beriladi.

      8 sekund davomida:
      tez -> silliq -> sekin.
    */

    canvas.style.transition =
      "transform 8s cubic-bezier(0.12, 0.72, 0.18, 1)";


    /*
      Browser transitionni
      majburan hisoblatamiz.
    */

    void canvas.offsetWidth;


    /*
      AYLANTIRISH
    */

    canvas.style.transform =
      `rotate(${finalRotation}deg)`;


    rotation =
      finalRotation;


    /*
      8 sekunddan keyin winner.
    */

    setTimeout(
      () => {

        finishSpin(
          state
        );

      },
      8200
    );

  }


  /*
  =====================================================
  FINISH SPIN
  =====================================================
  */

  function finishSpin(state) {

    spinning = false;


    statusEl.className =
      "status finished";

    statusEl.textContent =
      "🎉 G'olib aniqlandi!";


    winnerName.textContent =
      state.winner || "—";


    /*
      Winnerni ko'rsatamiz.
    */

    winnerBox.classList.add(
      "show"
    );


    /*
      Winner listga qo'shamiz.
    */

    addWinner(
      state.winner
    );


    /*
      Keyingi spin uchun
      yangi participantlarni olamiz.
    */

    setTimeout(
      () => {

        loadParticipants();

      },
      700
    );

  }


  /*
  =====================================================
  ADD WINNER
  =====================================================
  */

  function addWinner(name) {

    if (!name) {
      return;
    }


    const exists =
      Array.from(
        winnerList.children
      ).some(
        item =>
          item.dataset.name ===
          String(name)
      );


    if (exists) {
      return;
    }


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "winner-item";


    item.dataset.name =
      String(name);


    item.textContent =
      "⭐ " + name;


    winnerList.prepend(
      item
    );


    /*
      Faqat 5 ta winner.
    */

    while (
      winnerList.children.length > 5
    ) {

      winnerList.lastElementChild.remove();

    }

  }


  /*
  =====================================================
  CHECK STATE
  =====================================================
  */

  async function checkState() {

    if (spinning) {
      return;
    }


    const state =
      await loadState();


    if (!state) {
      return;
    }


    const spinId =
      Number(
        state.spin_id ||
        state.current_spin ||
        0
      );


    /*
      Yangi spin bo'lsa.
    */

    if (
      state.status === "spinning" &&
      spinId > currentSpinId
    ) {

      console.log(
        "NEW SPIN:",
        spinId
      );


      /*
        Avval aynan o'sha paytdagi
        participant listni olamiz.
      */

      await loadParticipants();


      /*
        Keyin spin.
      */

      if (
        participants.length > 0
      ) {

        currentSpinId =
          spinId;


        startSpin(
          state
        );

      }

    }


    /*
      Ready holati.
    */

    if (
      state.status === "ready" &&
      !spinning
    ) {

      statusEl.className =
        "status";

      statusEl.textContent =
        "🎁 Giveaway tayyor";

    }

  }


  /*
  =====================================================
  POLLING
  =====================================================
  */

  async function polling() {

    await checkState();


    /*
      Har 500ms serverni tekshiramiz.
    */

    setTimeout(
      polling,
      500
    );

  }


  /*
  =====================================================
  INIT
  =====================================================
  */

  async function init() {

    /*
      Boshlang'ich wheel.
    */

    drawEmptyWheel();


    /*
      Participantlarni yuklash.
    */

    await loadParticipants();


    /*
      State olish.
    */

    const state =
      await loadState();


    if (state) {

      currentSpinId =
        Number(
          state.spin_id ||
          state.current_spin ||
          0
        );

    }


    /*
      Real-time polling.
    */

    polling();

  }


  /*
  =====================================================
  START
  =====================================================
  */

  init();

</script>

</body>
</html>
