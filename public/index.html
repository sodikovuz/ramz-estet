<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMZ ESTET — Live Wheel</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050505;color:#fff}
body{overflow-x:hidden;background:
radial-gradient(circle at 50% 10%,#310000 0,#100000 32%,#050505 72%)}
.wrap{width:min(980px,94vw);margin:auto;padding:28px 0 50px;text-align:center}
.brand{font-size:clamp(36px,8vw,72px);font-weight:950;letter-spacing:5px;text-shadow:0 0 20px #f0000033}
.sub{color:#999;letter-spacing:2px;font-size:13px;margin:7px 0 28px}
.stage{position:relative;width:min(720px,92vw);aspect-ratio:1;margin:auto}
#wheel{width:100%;height:100%;display:block;border-radius:50%;background:#111;
border:8px solid #181818;box-shadow:0 0 0 4px #520000,0 0 55px #ff000033;
transform:rotate(0deg);transform-origin:center;will-change:transform}
.pointer{position:absolute;z-index:5;left:50%;top:-7px;transform:translateX(-50%);
width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;
border-bottom:52px solid #ff2222;filter:drop-shadow(0 0 9px #f00)}
.center{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);
width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle,#f33,#900,#250000);border:6px solid #111;
font-weight:900;font-size:13px;box-shadow:0 0 25px #f0000066}
.status{min-height:30px;margin:24px 0;font-weight:800;color:#aaa}
.status.live{color:#ff3b3b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.card{width:min(620px,94vw);margin:auto;padding:20px;border:1px solid #ffffff12;
border-radius:18px;background:#ffffff06}
.names{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;color:#aaa;font-size:13px}
.name{padding:7px 10px;background:#ffffff08;border-radius:10px}
.conn{position:fixed;right:12px;bottom:12px;padding:7px 11px;border-radius:18px;
background:#000b;border:1px solid #fff1;color:#aaa;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}
.dot.ok{background:#25d366;box-shadow:0 0 8px #25d366}
.dot.bad{background:#f33}
@media(max-width:600px){.center{width:70px;height:70px;font-size:10px}.pointer{border-left-width:16px;border-right-width:16px;border-bottom-width:38px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">RAMZ ESTET</div>
  <div class="sub">LIVE GIVEAWAY WHEEL</div>

  <div class="stage">
    <div class="pointer"></div>
    <canvas id="wheel" width="1000" height="1000"></canvas>
    <div class="center">RAMZ<br>ESTET</div>
  </div>

  <div id="status" class="status">Live ulanish tayyorlanmoqda...</div>

  <div class="card">
    <div id="names" class="names"></div>
  </div>
</div>

<div class="conn">
  <span id="dot" class="dot bad"></span>
  <span id="connText">Ulanmoqda...</span>
</div>

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const namesEl=document.getElementById("names");
const dot=document.getElementById("dot");
const connText=document.getElementById("connText");

let rotation=0;
let activeSpinId=0;
let spinning=false;

function setConn(ok){
  dot.className="dot "+(ok?"ok":"bad");
  connText.textContent=ok?"Live":"Ulanish yo‘q";
}

function drawWheel(list){
  const n=list.length;
  const c=500,r=488;
  ctx.clearRect(0,0,1000,1000);
  if(!n){
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#777";ctx.font="bold 30px Arial";ctx.textAlign="center";
    ctx.fillText("KUTING...",c,c); return;
  }

  const slice=Math.PI*2/n;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*slice;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+slice);ctx.closePath();
    ctx.fillStyle=i%2?"#720000":"#171717";ctx.fill();
    ctx.strokeStyle="#ffffff18";ctx.lineWidth=2;ctx.stroke();

    ctx.save();
    ctx.translate(c,c);
    ctx.rotate(a+slice/2);
    ctx.textAlign="right";ctx.textBaseline="middle";
    const fs=n>30?14:n>20?17:n>12?20:24;
    ctx.font=`900 ${fs}px Arial`;
    ctx.fillStyle="#fff";
    let s=String(list[i]||"");
    if(s.length>18)s=s.slice(0,17)+"…";
    ctx.fillText(s,r-30,0);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);
  ctx.strokeStyle="#ff2020";ctx.lineWidth=8;ctx.stroke();
}

function showNames(list){
  namesEl.innerHTML="";
  for(const n of list){
    const d=document.createElement("span");
    d.className="name";d.textContent=n;
    namesEl.appendChild(d);
  }
}

function easeOutCubic(t){
  return 1-Math.pow(1-t,3);
}

/*
  Animation uses requestAnimationFrame instead of relying only on CSS
  transitions. This lets a late-joining viewer calculate the exact
  current progress from the server's startAt timestamp.
*/
function animateFromState(data){
  const list=Array.isArray(data.participants)?data.participants:[];
  const n=list.length;
  const idx=Number(data.targetIndex);
  const duration=Number(data.durationMs)||8000;
  const startAt=Number(data.startAt);

  if(!n || !Number.isInteger(idx) || idx<0 || idx>=n) return;

  const slice=360/n;
  const target=360-(idx*slice+slice/2);

  let current=((rotation%360)+360)%360;
  let delta=target-current;
  if(delta<0)delta+=360;

  const totalDelta=360*8+delta;
  const baseRotation=rotation;
  const now=Date.now();
  const elapsed=Math.max(0,now-startAt);

  spinning=true;
  statusEl.className="status live";
  statusEl.textContent="🎰 BARABAN AYLANMOQDA...";

  function frame(){
    const e=Date.now()-startAt;
    const p=Math.min(1,e/duration);
    const eased=easeOutCubic(p);

    rotation=baseRotation+totalDelta*eased;
    canvas.style.transform=`rotate(${rotation}deg)`;

    if(p<1){
      requestAnimationFrame(frame);
    }else{
      spinning=false;
      rotation=baseRotation+totalDelta;
      canvas.style.transform=`rotate(${rotation}deg)`;
      statusEl.className="status";
      statusEl.textContent="Spin yakunlandi";
    }
  }

  requestAnimationFrame(frame);
}

async function connect(){
  try{
    const ably=new Ably.Realtime({
      authCallback:async (_params,callback)=>{
        try{
          const r=await fetch("/api/ably-token",{cache:"no-store"});
          if(!r.ok)throw new Error("Token error");
          const token=await r.json();
          callback(null,token);
        }catch(e){callback(e,null)}
      }
    });

    const channel=ably.channels.get("ramz-giveaway");

    channel.subscribe("spin",message=>{
      const data=message.data;
      if(!data)return;

      const spinId=Number(data.spinId||0);
      if(spinId<=activeSpinId)return;

      activeSpinId=spinId;

      const list=Array.isArray(data.participants)?data.participants:[];
      drawWheel(list);
      showNames(list);

      /*
        If event arrives late, animateFromState starts from the
        correct elapsed position rather than replaying the full 8s.
      */
      animateFromState(data);
    });

    channel.subscribe("reset",()=>{
      spinning=false;
      rotation=0;
      canvas.style.transform="rotate(0deg)";
      statusEl.className="status";
      statusEl.textContent="Live ulanish tayyor";
    });

    ably.connection.on("connected",()=>setConn(true));
    ably.connection.on("disconnected",()=>setConn(false));
    ably.connection.on("suspended",()=>setConn(false));
    ably.connection.on("failed",()=>setConn(false));

    setConn(true);

    /*
      Recover state if the page opens after a spin started.
    */
    const r=await fetch("/api/state",{cache:"no-store"});
    if(r.ok){
      const s=await r.json();
      const spinId=Number(s.spin_id||0);
      if(s.status==="spinning" && spinId>activeSpinId){
        activeSpinId=spinId;
        const list=Array.isArray(s.participants)?s.participants:[];
        drawWheel(list);showNames(list);
        animateFromState({
          spinId,
          startAt:Number(s.start_at),
          durationMs:Number(s.duration_ms),
          targetIndex:Number(s.target_index),
          participants:list
        });
      }else if(Array.isArray(s.participants)){
        drawWheel(s.participants);showNames(s.participants);
      }
    }
  }catch(e){
    console.error(e);
    setConn(false);
    statusEl.textContent="Ulanishda xatolik";
  }
}

connect();
</script>
</body>
</html>
